# B-window Block/Wake substitute capture.
# No tracefs on this kernel -> no sched_switch/sched_waking tracepoints.
# Instead: software perf event SW_CONTEXT_SWITCHES (period 1) with callchains,
# i.e. a real "where did this thread leave the CPU" sample per context switch.
duration_ms: 30000
flush_period_ms: 3000
buffers { size_kb: 32768 fill_policy: RING_BUFFER }

data_sources { config {
  name: "linux.process_stats"
  process_stats_config { scan_all_processes_on_start: true proc_stats_poll_ms: 1000 }
} }

data_sources { config {
  name: "track_event"
  track_event_config {
    disabled_categories: "*"
    enabled_categories: "pipeline"
    enabled_categories: "memory"
    enabled_categories: "sync"
    enabled_categories: "io"
    enabled_categories: "demo"
  }
} }

data_sources { config {
  name: "linux.perf"
  perf_event_config {
    timebase { counter: SW_CONTEXT_SWITCHES period: 1 timestamp_clock: PERF_CLOCK_MONOTONIC }
    callstack_sampling { scope { target_pid: TARGET_PID_HERE } kernel_frames: true }
    ring_buffer_pages: 64
    max_daemon_memory_kb: 16384
  }
} }
