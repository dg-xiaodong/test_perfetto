#
# pf-demo-x5 trace config for kernels built WITH ftrace (the RDK X5 image under
# test does NOT have it: CONFIG_FTRACE=n, no tracefs). Keep this file for
# boards/kernels where sched + block + cpufreq tracepoints exist; it adds the
# scheduling / I/O / frequency data that the training deck's Scheduling page
# needs. Everything else is identical to trace_smoke.cfg.

buffers {
  size_kb: 32768
  fill_policy: RING_BUFFER
}

data_sources {
  config {
    name: "linux.ftrace"
    target_buffer: 0
    ftrace_config {
      ftrace_events: "sched/sched_switch"
      ftrace_events: "sched/sched_waking"
      ftrace_events: "sched/sched_wakeup"
      ftrace_events: "sched/sched_process_exit"
      ftrace_events: "task/task_newtask"
      ftrace_events: "task/task_rename"
      ftrace_events: "power/cpu_frequency"
      ftrace_events: "power/cpu_idle"
      ftrace_events: "power/suspend_resume"
      ftrace_events: "block/block_rq_issue"
      ftrace_events: "block/block_rq_complete"
      ftrace_events: "raw_syscalls/sys_enter"
      ftrace_events: "raw_syscalls/sys_exit"
      atrace_categories: ""
      symbolize_ksyms: true
      initialize_ksyms_synchronously_for_testing: false
      drain_period_ms: 250
    }
  }
}

data_sources {
  config {
    name: "track_event"
    target_buffer: 0
    track_event_config {
      enabled_categories: "pipeline"
      enabled_categories: "memory"
      enabled_categories: "sync"
      enabled_categories: "io"
      enabled_categories: "demo"
    }
  }
}

data_sources {
  config {
    name: "linux.process_stats"
    target_buffer: 0
    process_stats_config {
      scan_all_processes_on_start: false
      proc_stats_poll_ms: 500
    }
  }
}

data_sources {
  config {
    name: "linux.sys_stats"
    target_buffer: 0
    sys_stats_config {
      meminfo_period_ms: 500
      meminfo_counters: MEMINFO_MEM_TOTAL
      meminfo_counters: MEMINFO_MEM_FREE
      meminfo_counters: MEMINFO_MEM_AVAILABLE
      meminfo_counters: MEMINFO_CACHED
      vmstat_period_ms: 500
      vmstat_counters: VMSTAT_PGFAULT
      vmstat_counters: VMSTAT_PGMAJFAULT
      stat_period_ms: 500
      stat_counters: STAT_CPU_TIMES
      cpufreq_period_ms: 500
    }
  }
}

data_sources {
  config {
    name: "linux.perf"
    target_buffer: 0
    perf_event_config {
      timebase {
        frequency: 200
        counter: HW_CPU_CYCLES
      }
      callstack_sampling {
        kernel_frames: false
      }
      ring_buffer_pages: 256
    }
  }
}

duration_ms: 15000

write_into_file: true
file_write_period_ms: 1000
flush_period_ms: 5000
