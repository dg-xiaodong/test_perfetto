#
# pf-demo-x5 smoke trace config — for RDK X5 (kernel 6.1.83-DR-PL5.1_V1.1.1,
# buildroot). This kernel is built with CONFIG_FTRACE=n: there is no tracefs and
# no sched/block tracepoint, so the ftrace-backed data sources (sched, block
# I/O, cpu_frequency via ftrace) cannot produce data here. Verified on-board:
#
#   zcat /proc/config.gz | grep CONFIG_FTRACE   -> # CONFIG_FTRACE is not set
#   mount -t tracefs tracefs /tmp/tr            -> No such device
#
# The config therefore enables every data source that DOES work on this kernel:
#   - track_event        : slices / flows / counters from the SDK
#   - linux.process_stats: process/thread descriptors, RSS counters
#   - linux.sys_stats    : meminfo, vmstat, per-CPU times, cpufreq counters
#   - linux.perf         : perf_event CPU sampling with callstacks (traced_perf)
#
# Use configs/trace_ftrace.cfg instead on boards whose kernel has FTRACE.

buffers {
  size_kb: 32768
  fill_policy: RING_BUFFER
}

data_sources {
  config {
    name: "track_event"
    target_buffer: 0
    track_event_config {
      enabled_categories: "pipeline"
      enabled_categories: "memory"
      enabled_categories: "sync"
      enabled_categories: "io"
      enabled_categories: "demo"
    }
  }
}

data_sources {
  config {
    name: "linux.process_stats"
    target_buffer: 0
    process_stats_config {
      scan_all_processes_on_start: false
      proc_stats_poll_ms: 500
    }
  }
}

data_sources {
  config {
    name: "linux.sys_stats"
    target_buffer: 0
    sys_stats_config {
      meminfo_period_ms: 500
      meminfo_counters: MEMINFO_MEM_TOTAL
      meminfo_counters: MEMINFO_MEM_FREE
      meminfo_counters: MEMINFO_MEM_AVAILABLE
      meminfo_counters: MEMINFO_CACHED
      vmstat_period_ms: 500
      vmstat_counters: VMSTAT_PGFAULT
      vmstat_counters: VMSTAT_PGMAJFAULT
      stat_period_ms: 500
      stat_counters: STAT_CPU_TIMES
      cpufreq_period_ms: 500
    }
  }
}

data_sources {
  config {
    name: "linux.perf"
    target_buffer: 0
    perf_event_config {
      timebase {
        frequency: 200
        counter: HW_CPU_CYCLES
      }
      callstack_sampling {
        kernel_frames: false
      }
      ring_buffer_pages: 256
    }
  }
}

# Overwritten by scripts/trace.sh to the requested duration.
duration_ms: 15000

write_into_file: true
file_write_period_ms: 1000
flush_period_ms: 5000
