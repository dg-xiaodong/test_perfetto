#
# pf-demo-x5 native-heap profile session (heapprofd on Linux via LD_PRELOAD).
#
# The target process must be started with
#   LD_PRELOAD=/userdata/perfetto-training-demo/lib/libheapprofd_glibc_preload.so
# *before* this session starts (heapprofd's Linux client attaches inside the
# process at startup; a running process cannot be injected).
#
# Blocking init is deliberately OFF here: setting
# PERFETTO_HEAPPROFD_BLOCKING_INIT=1 makes the very first malloc wait until
# heapprofd has attached, which is exactly what you must NOT do for an
# always-on service. block_client is false for the same reason.
#
# scripts/heap-profile.sh wires the sequence:
#   1. start this session with tracebox --system-sockets --background-wait
#   2. launch pf-demo-x5 with LD_PRELOAD set for a bounded run
#   3. stop the session -> trace contains heap_profile_allocation rows

buffers {
  size_kb: 65536
  fill_policy: RING_BUFFER
}

data_sources {
  config {
    name: "android.heapprofd"
    target_buffer: 0
    heapprofd_config {
      sampling_interval_bytes: 4096
      shmem_size_bytes: 8388608
      block_client: false
      process_cmdline: "pf-demo-x5"
      continuous_dump_config {
        dump_phase_ms: 2000
        dump_interval_ms: 3000
      }
    }
  }
}

data_sources {
  config {
    name: "track_event"
    target_buffer: 0
    track_event_config {
      enabled_categories: "pipeline"
      enabled_categories: "memory"
      enabled_categories: "sync"
      enabled_categories: "io"
      enabled_categories: "demo"
    }
  }
}

data_sources {
  config {
    name: "linux.process_stats"
    target_buffer: 0
    process_stats_config {
      scan_all_processes_on_start: false
      proc_stats_poll_ms: 500
    }
  }
}

data_sources {
  config {
    name: "linux.sys_stats"
    target_buffer: 0
    sys_stats_config {
      meminfo_period_ms: 500
      meminfo_counters: MEMINFO_MEM_TOTAL
      meminfo_counters: MEMINFO_MEM_FREE
      meminfo_counters: MEMINFO_MEM_AVAILABLE
      stat_period_ms: 500
      stat_counters: STAT_CPU_TIMES
      cpufreq_period_ms: 500
    }
  }
}

# Overwritten by scripts/heap-profile.sh to the requested duration.
duration_ms: 25000

write_into_file: true
file_write_period_ms: 1000
flush_period_ms: 3000
